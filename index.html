<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lão Tướng Cup</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <div class="hero">
        <div class="hero-bg"></div>
        <div class="hero-inner">
          <div class="hero-eyebrow">
            <div class="live-dot"></div>
            <span class="eyebrow-text">Đang diễn ra</span>
          </div>
          <div class="hero-title">Lão Tướng Hội Đền Am – Tây Mỗ</div>
          <div class="hero-sub">Mùa giải 2026 · 6 đội · Vòng bảng</div>
          <div class="next-match">
            <div class="next-label">Trận tiếp theo</div>
            <div class="next-teams" id="nextTeams">
              <div class="next-team" id="nHome">–</div>
              <div class="next-center"><div class="next-vs">vs</div></div>
              <div class="next-team away" id="nAway">–</div>
            </div>
            <div class="next-datetime" id="nextMeta"></div>
          </div>
        </div>
      </div>
      <div class="tabs">
        <button class="tab-btn on" onclick="switchTab('rank', this)">
          Xếp hạng
        </button>
        <button class="tab-btn" onclick="switchTab('matches', this)">
          Lịch đấu
        </button>
      </div>
      <div class="body">
        <div class="pane on" id="pane-rank">
          <div class="stat-chips" id="statChips"></div>
          <div class="rank-wrap">
            <div class="rank-head">
              <div class="rh">#</div>
              <div class="rh left">Đội</div>
              <div class="rh">T</div>
              <div class="rh">H</div>
              <div class="rh">B</div>
              <div class="rh">HS</div>
              <div class="rh">BT</div>
              <div class="rh" style="color: #0f2d1a; font-weight: 600">
                Điểm
              </div>
            </div>
            <div id="rankRows"></div>
          </div>
        </div>

        <div class="pane" id="pane-matches">
          <div id="matchList"></div>
        </div>
      </div>
      <div class="toast-bar" id="toast"></div>
    </div>
    <div class="footer">
      <p>FishBird hân hạnh được đồng hành cùng giải đấu</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
